server:
  port: 8000

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: CATDOGSHELTER-GATEWAY

  cloud:
    gateway:
      # 응답 헤더 중복 제거
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      # ★ Gateway 전역 CORS (위치와 키가 'gateway.globalcors' 여야 함)
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            # allowCredentials(true)와 함께 '*'는 사용할 수 없음 → patterns로 변경
            allowedOriginPatterns:
              - 'http://localhost:5173'
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # POST 서비스 라우팅 (프론트는 /post-service/** 로 호출)
        - id: CatDogShelter-post-service
          uri: lb://CATDOGSHELTER-POST-SERVICE
          predicates:
            - Path=/post-service/**
          filters:
            # /post-service/xxx  →  /xxx 로 내부 서비스에 전달
            - RewritePath=/post-service/(?<segment>.*), /${segment}

        # User API 라우팅
        - id: CatDogShelter-user-api
          uri: lb://CATDOGSHELTER-USER-SERVICE
          predicates:
            - Path=/user-service/user/**
          filters:
            - RewritePath=/user-service/user/(?<segment>.*), /user/${segment}

        # ShelterHead API 라우팅
        - id: CatDogShelter-shelter-head-api
          uri: lb://CATDOGSHELTER-USER-SERVICE
          predicates:
            - Path=/user-service/shelter-head/**
          filters:
            - RewritePath=/user-service/shelter-head/(?<segment>.*), /shelter-head/${segment}

