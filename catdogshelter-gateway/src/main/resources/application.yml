server:
  port: 8000
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  application:
    name: CATDOGSHELTER-GATEWAY
  cloud:
    default-filters:
      - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
    globalcors:
      cors-configurations:
        '[/**]':
          allowedOrigins:
            - 'http://localhost:5173' # 허용하려는 도메인
          allow-credentials: true # 요청 시 인증 정보를 전송하도록 허가
          allowedHeaders: '*' # 허용하려는 헤더
          allowedMethods: # 허용하려는 HTTP 메서드
            - PUT
            - GET
            - POST
            - DELETE
            - OPTIONS
    gateway:
      routes:
        # POST API 라우팅
        - id: CatDogShelter-post-service
          uri: lb://CATDOGSHELTER-POST-SERVICE
          predicates:
            - Path=/post-service/**
          filters:
            - RewritePath=/post-service/(?<segment>.*), /$\{segment}
            - AuthorizationHeaderFilter # 테스트 할때 얘를 주석하고 테스트
        # User API 라우팅
        - id: CatDogShelter-user-api
          uri: lb://CATDOGSHELTER-USER-SERVICE
          predicates:
            - Path=/user-service/user/**
          filters:
            - RewritePath=/user-service/user/(?<segment>.*), /user/$\{segment}

        # ShelterHead API 라우팅
        - id: CatDogShelter-shelter-head-api
          uri: lb://CATDOGSHELTER-USER-SERVICE
          predicates:
            - Path=/user-service/shelter-head/**
          filters:
            - RewritePath=/user-service/shelter-head/(?<segment>.*), /shelter-head/$\{segment}


